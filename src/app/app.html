<header class="site-header">
  <nav class="site-nav" aria-label="Principal">
  <a routerLink="/" class="brand">Menú Digital</a>

  <ul class="site-nav__links">
  @if (!auth.isLoggedIn()) {
    <li>
      <a routerLink="/cart" routerLinkActive="is-active" ariaCurrentWhenActive="page" class="cart-link">
        Carrito
        <span class="cart-count" aria-live="polite">
          {{ cart.totalQuantity() }}
          <span class="visually-hidden">productos</span>
        </span>
      </a>
    </li>
  }
  @if (auth.isLoggedIn()) {
    <li><a routerLink="/owner" routerLinkActive="is-active" ariaCurrentWhenActive="page">Mi panel</a></li>
    <li><button type="button" class="link-button" (click)="auth.logout()">Salir</button></li>
  } @else {
    <li><a routerLink="/login" routerLinkActive="is-active" ariaCurrentWhenActive="page">Ingresar</a></li>
  }
</ul>
</nav>
</header>

<main class="site-main">
  <router-outlet />
</main>

<footer class="site-footer">
  <p>Menú Digital · Trabajo práctico TUP</p>
</footer>
