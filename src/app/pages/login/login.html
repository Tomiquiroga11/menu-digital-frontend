<section class="form-card" aria-labelledby="login-title">
  <h1 id="login-title">Ingresar</h1>
  <p class="form-card__intro">Accedé al panel de tu restaurante.</p>

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="field">
      <label for="email">Email</label>
      <input
        id="email"
        type="email"
        formControlName="email"
        autocomplete="email"
        [attr.aria-invalid]="hasError('email')"
        [attr.aria-describedby]="hasError('email') ? 'email-error' : null"
      />
      @if (hasError('email')) {
        <p id="email-error" class="field__error">Ingresá un email válido.</p>
      }
    </div>

    <div class="field">
      <label for="password">Contraseña</label>
      <input
        id="password"
        type="password"
        formControlName="password"
        autocomplete="current-password"
        [attr.aria-invalid]="hasError('password')"
        [attr.aria-describedby]="hasError('password') ? 'password-error' : null"
      />
      @if (hasError('password')) {
        <p id="password-error" class="field__error">Ingresá tu contraseña.</p>
      }
    </div>

    @if (errorMessage()) {
      <p class="status status--error" role="alert">{{ errorMessage() }}</p>
    }

    <button type="submit" class="button form-card__submit" [disabled]="isSubmitting()">
      {{ isSubmitting() ? 'Ingresando...' : 'Ingresar' }}
    </button>
  </form>

  <p class="form-card__footer">¿No tenés cuenta? <a routerLink="/register">Registrá tu restaurante</a></p>
</section>
