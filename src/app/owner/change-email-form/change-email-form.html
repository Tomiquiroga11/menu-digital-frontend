<form [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <div class="field">
    <label for="email-newEmail">Email nuevo</label>
    <input
      id="email-newEmail"
      type="email"
      formControlName="newEmail"
      autocomplete="email"
      [attr.aria-invalid]="hasError('newEmail')"
      [attr.aria-describedby]="hasError('newEmail') ? 'email-newEmail-error' : null"
    />
    @if (hasError('newEmail')) {
      <p id="email-newEmail-error" class="field__error">Ingresá un email válido.</p>
    }
  </div>

  <div class="field">
    <label for="email-currentPassword">Tu contraseña actual</label>
    <input
      id="email-currentPassword"
      type="password"
      formControlName="currentPassword"
      autocomplete="current-password"
      [attr.aria-invalid]="hasError('currentPassword')"
      [attr.aria-describedby]="hasError('currentPassword') ? 'email-currentPassword-hint email-currentPassword-error' : 'email-currentPassword-hint'"
    />
    <p id="email-currentPassword-hint" class="field__hint">La pedimos para confirmar que sos vos.</p>
    @if (hasError('currentPassword')) {
      <p id="email-currentPassword-error" class="field__error">Ingresá tu contraseña actual.</p>
    }
  </div>

  @if (errorMessage()) {
    <p class="status status--error" role="alert">{{ errorMessage() }}</p>
  }

  <div class="form-actions">
    <button type="submit" class="button button--small" [disabled]="isSaving()">
      {{ isSaving() ? 'Guardando...' : 'Guardar email' }}
    </button>
  </div>
</form>
